[project]
name = "pdl"
version = "0.0.0"
description = "教学型深度学习工程库：用 PyTorch 张量与自动微分，从零实现层、损失、优化器与训练循环"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdl"]

# ---------------------------------------------------------------- 依赖来源

# torch 的默认 wheel 在 Linux 上会拖一整套 CUDA 运行时（2 GB 以上），
# 而本项目只跑 CPU。显式指向 CPU 索引，安装体积和 CI 时间都能少一个数量级。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# ---------------------------------------------------------------- 格式与 lint

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# docs/ 里的 Python 代码块是讲解用的示意代码，不是可执行代码：
# 里面的对齐注释、省略号、伪代码会被 formatter 改坏，所以整目录排除在 lint/format 之外。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # ruff 自有规则
    "ANN", # 类型注解
    "D",   # pydocstyle
]
ignore = [
    "D203",    # 与 D211 冲突，二选一
    "D213",    # 与 D212 冲突，二选一
    "D400",    # 中文句子以"。"结尾，pydocstyle 只认 ASCII 句号
    "D415",
    "RUF001",  # 本项目用中文写注释和文档字符串，全角标点是正常书写，不是"易混淆字符"
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 测试文件放宽注解与文档字符串要求，但保留 pytest 风格检查（PT）。
"tests/**" = ["ANN", "D"]

# ---------------------------------------------------------------- 类型检查

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/pdl", "scripts"]
warn_unreachable = true

# ---------------------------------------------------------------- 测试

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: 运行较慢的测试（默认仍然执行，可用 -m 'not slow' 跳过）",
]

[tool.coverage.run]
branch = true
source = ["pdl"]

[tool.coverage.report]
show_missing = true
skip_covered = true
