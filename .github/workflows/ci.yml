name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # 必须用 UV_PYTHON，不能用 `uv sync --python X`：
      # 后者只影响那一次 sync，之后每个 `uv run` 都会按 .python-version 重新同步回 3.12，
      # 三个矩阵项实际测的是同一个版本，矩阵就成了摆设。
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        # 钉精确版本：这个 action 没有发布 v8+ 的浮动大版本 tag，
        # 写 @v10 会直接解析失败，整个 job 起不来。
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: 同步依赖
        run: uv sync --all-groups

      - name: 格式检查
        run: uv run ruff format --check .

      - name: lint
        run: uv run ruff check .

      - name: 类型检查
        run: uv run mypy

      - name: 测试与覆盖率
        run: >
          uv run pytest
          --cov=pdl
          --cov-report=term-missing
          --cov-fail-under=90

  commit-message:
    name: commit message
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史才能 diff 出这个 PR 上的所有 commit。
          fetch-depth: 0

      - name: 校验 PR 上的每一条 commit message
        run: |
          git log --format=%s "origin/${{ github.base_ref }}..HEAD" \
            | python3 scripts/check_commit_msg.py --stdin
